<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-labelledby="t d">
  <title id="t">Agentic AI Institutional Knowledge System — architecture</title>
  <desc id="d">Offline: .docx documents are extracted, deduplicated by SHA-256, chunked by section, embedded with BGE and stored in ChromaDB with access-level metadata. Query time: a LangGraph agent analyses and plans the query, runs role-filtered hybrid retrieval (dense plus BM25, fused with reciprocal rank fusion and reranked by a cross-encoder), validates context, generates with Qwen3 8B on Ollama, attaches citations and scores confidence, retrying once through a reflection step when confidence is low.</desc>
  <!-- THEME:START -->
  <style>
    .bg   { fill: #0b1220; }
    .box  { fill: #0f1a2e; stroke: #24324f; stroke-width: 1.2; }
    .key  { fill: #0f1a2e; stroke: #22d3ee; stroke-width: 1.4; }
    .ttl  { fill: #e6edf7; font: 600 15px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .sub  { fill: #8b9bbd; font: 12.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .acc  { fill: #22d3ee; font: 12.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .vio  { fill: #a5b4fc; font: 12.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .sec  { fill: #5f7096; font: 600 11.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: .14em; }
    .arr  { stroke: #3b4d72; stroke-width: 1.6; fill: none; }
    .loop { stroke: #818cf8; stroke-width: 1.6; fill: none; stroke-dasharray: 5 5; }
    .head { fill: #3b4d72; }
    .vhead{ fill: #818cf8; }
    .rule { stroke: #1b2742; stroke-width: 1; }
  </style>
  <!-- THEME:END -->
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="head" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="vhead" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <rect class="bg" width="1200" height="470" rx="16"/>

  <!-- Offline ingestion -->
  <text class="sec" x="30" y="44">OFFLINE · INGESTION</text>
  <g>
    <rect class="box" x="30"  y="62" width="190" height="84" rx="10"/>
    <text class="ttl" x="46" y="90">Source documents</text>
    <text class="sub" x="46" y="112">.docx SOPs per department</text>
    <text class="sub" x="46" y="130">table-aware text extraction</text>

    <rect class="box" x="260" y="62" width="190" height="84" rx="10"/>
    <text class="ttl" x="276" y="90">Ingestion ledger</text>
    <text class="sub" x="276" y="112">SHA-256 dedupe, versioning</text>
    <text class="sub" x="276" y="130">SQLite audit trail</text>

    <rect class="box" x="490" y="62" width="190" height="84" rx="10"/>
    <text class="ttl" x="506" y="90">Section-aware chunks</text>
    <text class="sub" x="506" y="112">1200 / 150 recursive split</text>
    <text class="sub" x="506" y="130">procedure blocks kept whole</text>

    <rect class="box" x="720" y="62" width="190" height="84" rx="10"/>
    <text class="ttl" x="736" y="90">Embeddings</text>
    <text class="acc" x="736" y="112">bge-base-en-v1.5</text>
    <text class="sub" x="736" y="130">asymmetric query prefix</text>

    <rect class="box" x="950" y="62" width="220" height="84" rx="10"/>
    <text class="ttl" x="966" y="90">ChromaDB</text>
    <text class="sub" x="966" y="112">vectors + source metadata</text>
    <text class="acc" x="966" y="130">access_level per chunk</text>

    <path class="arr" marker-end="url(#a)" d="M220 104 H256"/>
    <path class="arr" marker-end="url(#a)" d="M450 104 H486"/>
    <path class="arr" marker-end="url(#a)" d="M680 104 H716"/>
    <path class="arr" marker-end="url(#a)" d="M910 104 H946"/>
  </g>

  <line class="rule" x1="30" y1="178" x2="1170" y2="178"/>

  <!-- Query-time agent -->
  <text class="sec" x="30" y="208">QUERY TIME · LANGGRAPH AGENT</text>
  <g>
    <rect class="box" x="30" y="248" width="190" height="96" rx="10"/>
    <text class="ttl" x="46" y="276">User question</text>
    <text class="sub" x="46" y="298">FastAPI · JWT session</text>
    <text class="acc" x="46" y="320">role: Public → Admin</text>

    <rect class="box" x="260" y="248" width="190" height="96" rx="10"/>
    <text class="ttl" x="276" y="276">Analyse &amp; plan</text>
    <text class="sub" x="276" y="298">intent, follow-up resolution</text>
    <text class="sub" x="276" y="318">up to 3 retrieval steps</text>

    <rect class="key" x="490" y="226" width="190" height="140" rx="10"/>
    <text class="ttl" x="506" y="254">Hybrid retrieval</text>
    <text class="sub" x="506" y="278">dense (BGE)  +  BM25</text>
    <text class="sub" x="506" y="298">reciprocal rank fusion</text>
    <text class="acc" x="506" y="318">bge-reranker-base</text>
    <text class="vio" x="506" y="346">RBAC filter in query</text>

    <rect class="box" x="720" y="248" width="190" height="96" rx="10"/>
    <text class="ttl" x="736" y="276">Validate &amp; generate</text>
    <text class="sub" x="736" y="298">drop weak chunks, cap 6</text>
    <text class="acc" x="736" y="320">Qwen3:8B · Ollama</text>

    <rect class="box" x="950" y="248" width="220" height="96" rx="10"/>
    <text class="ttl" x="966" y="276">Cite &amp; score</text>
    <text class="sub" x="966" y="298">[N] inline source citations</text>
    <text class="sub" x="966" y="318">confidence + hallucination risk</text>

    <path class="arr" marker-end="url(#a)" d="M220 296 H256"/>
    <path class="arr" marker-end="url(#a)" d="M450 296 H486"/>
    <path class="arr" marker-end="url(#a)" d="M680 296 H716"/>
    <path class="arr" marker-end="url(#a)" d="M910 296 H946"/>

    <!-- vector store feeds retrieval -->
    <path class="arr" marker-end="url(#a)" d="M1060 146 V190 H585 V222"/>

    <!-- reflection loop -->
    <path class="loop" marker-end="url(#v)" d="M1060 344 V408 H585 V370"/>
    <text class="vio" x="822" y="432" text-anchor="middle">low confidence → reflection agent broadens the query, one bounded retry</text>
  </g>
</svg>
